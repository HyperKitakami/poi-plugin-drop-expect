name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # 插件本体零依赖；测试只跑纯逻辑，不需要 npm install
      - run: npm test

      # 发布内容回归：files 字段改动导致漏文件时这里会看得出来
      - name: Check package contents
        run: npm pack --dry-run
